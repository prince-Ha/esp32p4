; Sensor node for the ESP32-P4 dashboard.
;
; Flash this to a plain ESP32 dev board. It advertises the same BLE service the
; P4 hub scans for, and notifies one reading per second. The P4 has no radio of
; its own, so it is worth remembering which side is which: the dev board here
; is the peripheral, and the P4 - despite being the bigger machine - is the
; central that connects to it.
;
; Build from this directory:
;   pio run -t upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=1
